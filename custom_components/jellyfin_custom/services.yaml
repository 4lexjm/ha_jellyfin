trigger_scan:
  name: Trigger library scan
  description: "Trigger a library scan on Jellyfin"
  fields:
    entity_id:
      name: Entity
      description: Jellyfin sensor entity.
      required: true
      example: "sensor.jellyfin_server"
      selector:
        entity:
          integration: jellyfin_custom
          domain: sensor

search:
  name: Search library
  description: "Search for items in the Jellyfin media library"
  fields:
    entity_id:
      name: Entity
      description: Jellyfin sensor entity.
      required: true
      example: "sensor.jellyfin_server"
      selector:
        entity:
          integration: jellyfin_custom
          domain: sensor
    search_term:
      name: Search term
      description: Search terms to look for.
      required: true
      example: "inception"
      selector:
        text:

browse:
  name: Browse to item
  description: "Display an item info on a Jellyfin client device"
  fields:
    entity_id:
      name: Entity
      description: Jellyfin media player entity.
      required: true
      example: "media_player.jellyfin_living_room"
      selector:
        entity:
          integration: jellyfin_custom
          domain: media_player
    id:
      name: Item ID
      description: ID of the item to browse to.
      required: true
      example: "82f6bfdbdb610529c086b3e2bca71ad6"
      selector:
        text:

delete:
  name: Delete item
  description: "Delete an item from the Jellyfin library and filesystem"
  fields:
    entity_id:
      name: Entity
      description: Jellyfin sensor entity.
      required: true
      example: "sensor.jellyfin_server"
      selector:
        entity:
          integration: jellyfin_custom
          domain: sensor
    id:
      name: Item ID
      description: ID of the item to delete.
      required: true
      example: "82f6bfdbdb610529c086b3e2bca71ad6"
      selector:
        text:

yamc_setpage:
  name: Set YAMC page
  description: "Set the active page for the YAMC upcoming media card"
  fields:
    entity_id:
      name: Entity
      description: Jellyfin sensor entity.
      required: true
      example: "sensor.jellyfin_server"
      selector:
        entity:
          integration: jellyfin_custom
          domain: sensor
    page:
      name: Page
      description: The page number to navigate to (1-indexed).
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 50

yamc_setplaylist:
  name: Set YAMC playlist
  description: "Set the active playlist for the YAMC upcoming media card"
  fields:
    entity_id:
      name: Entity
      description: Jellyfin sensor entity.
      required: true
      example: "sensor.jellyfin_server"
      selector:
        entity:
          integration: jellyfin_custom
          domain: sensor
    playlist:
      name: Playlist
      description: Playlist name (e.g. latest_movies, latest_episodes, nextup).
      required: true
      example: "latest_movies"
      selector:
        text: